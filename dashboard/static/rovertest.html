<!DOCTYPE html><html><head><meta charset="utf-8"><style>body{margin:0;background:#333}</style></head><body>
<script type="importmap">{"imports":{"three":"/static/vendor/three.module.js","three/addons/":"/static/vendor/"}}</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const loader=new GLTFLoader();
const load=u=>new Promise((res,rej)=>loader.load(u,g=>res(g.scene),undefined,rej));
const [chassisM,rockerM,wheelAM,wheelBM]=await Promise.all(['chassis','rocker','wheelA','wheelB'].map(n=>load('/static/rover/'+n+'.glb')));
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(1200,900);document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x404040);
scene.add(new THREE.HemisphereLight(0xffffff,0x444444,1.2));
const dl=new THREE.DirectionalLight(0xffffff,1.5);dl.position.set(3,5,4);scene.add(dl);
const world=new THREE.Group();world.rotation.x=-Math.PI/2;scene.add(world);
const grid=new THREE.GridHelper(2,20,0x888888,0x666666);grid.rotation.x=Math.PI/2;world.add(grid);
world.add(new THREE.AxesHelper(0.5)); // x red, y green, z blue (in z-up world)
function build(){
  const root=new THREE.Group();
  const chassis=chassisM.clone(true);root.add(chassis);
  function rocker(sign){const g=new THREE.Group();g.position.set(0.00263,sign*0.14167,-0.04731);if(sign>0)g.rotation.z=Math.PI;
    const m=rockerM.clone(true);g.add(m);return g;}
  const rl=rocker(1),rr=rocker(-1);root.add(rl,rr);
  function wheel(parent,x,mesh){const g=new THREE.Group();g.position.set(x,-0.08214,-0.08802);
    const m=mesh.clone(true);g.add(m);parent.add(g);return g;}
  wheel(rl,-0.15256,wheelAM);wheel(rl,0.15256,wheelAM);
  wheel(rr,0.15256,wheelBM);wheel(rr,-0.15256,wheelBM);
  return root;
}
const Q=new URLSearchParams(location.search);
let rover;
if(Q.get('part')){
  const M={chassis:chassisM,rocker:rockerM,wheelA:wheelAM,wheelB:wheelBM}[Q.get('part')];
  rover=M.clone(true);
}else rover=build();
rover.position.set(0,0,0.15256); // wheels radius above ground approx
world.add(rover);
const camera=new THREE.PerspectiveCamera(40,4/3,0.01,100);
const views={side:[1.2,0.25,0],front:[0,0.25,1.2],top:[0.001,1.4,0],iso:[0.9,0.6,0.9]};
views.posy=[0,0.05,-0.7];views.negy=[0,0.05,0.7];
window.setView=v=>{const p=views[v];camera.position.set(p[0],p[1],p[2]);camera.lookAt(0,0.05,0);renderer.render(scene,camera);};
setView('iso');
</script></body></html>
